<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>H₂O Logic Concentration</title>
<style>
:root {
  --purple: #534AB7; --purple-bg: #f9f8ff;
  --red: #993C1D; --red-bg: #FBF1ED;
  --green: #3B6D11; --green-bg: #F3F8EC;
  --orange: #BA7517;
  --text: #2c2c2c; --sub: #5F5E5A; --border: #e8e5ff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f5f5; display:flex; justify-content:center; align-items:center;
  min-height:100vh; padding:16px;
}
.card { max-width:420px; width:100%; background:#fff; border-radius:20px; padding:28px 22px 24px; box-shadow:0 4px 24px rgba(0,0,0,.06); }
.header { text-align:center; margin-bottom:24px; position:relative; }
.lang-btn {
  position:absolute; right:0; top:0; font-size:12px; font-weight:600;
  background:var(--purple-bg); color:var(--purple); border:1px solid var(--border);
  border-radius:8px; padding:4px 10px; cursor:pointer; transition:opacity .2s;
}
.lang-btn:hover { opacity:.8; }
.header h1 { font-size:22px; color:var(--text); font-weight:700; margin-bottom:4px; }
.header h1 sub { font-size:14px; font-weight:600; vertical-align:-2px; }
.header .sub { font-size:12px; color:var(--sub); letter-spacing:1px; }
.header .sub span { color:var(--purple); font-weight:600; }
.divider { height:1px; background:var(--border); margin:0 -22px 22px; }
.field { margin-bottom:18px; }
.field label { display:block; font-size:14px; color:var(--text); margin-bottom:6px; font-weight:500; }
.field .hint { font-size:12px; color:var(--sub); font-weight:400; }
.input-row { display:flex; align-items:center; gap:8px; }
.input-row input { flex:1; height:46px; border:2px solid #e0e0e0; border-radius:12px; padding:0 14px; font-size:20px; font-weight:600; color:var(--text); outline:none; transition:border .2s; text-align:center; -webkit-appearance:none; }
.input-row input:focus { border-color:var(--purple); }
.input-row .suffix { font-size:14px; color:var(--sub); white-space:nowrap; }
.btn { width:100%; height:50px; background:var(--purple); color:#fff; border:none; border-radius:14px; font-size:17px; font-weight:700; cursor:pointer; margin-top:6px; letter-spacing:2px; transition:opacity .2s; }
.btn:hover { opacity:.92; }
.btn:active { opacity:.82; }

.result { margin-top:22px; display:none; }
.result.show { display:block; }

.score-ring { width:140px; height:140px; margin:0 auto 14px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; }
.score-ring .pct { font-size:48px; font-weight:800; line-height:1; }
.score-ring .unit-label { font-size:12px; margin-top:2px; }

.meta-bar { text-align:center; font-size:13px; color:var(--sub); margin-bottom:16px; }
.meta-bar strong { color:var(--text); }

.diagnosis { border-radius:14px; padding:18px; font-size:14px; line-height:1.8; text-align:left; }
.diagnosis .level { font-size:15px; font-weight:700; margin-bottom:4px; }
.diagnosis .desc { font-size:14px; margin-bottom:10px; }
.diagnosis .tip { font-size:13px; color:var(--sub); margin-top:8px; padding-top:10px; border-top:1px solid rgba(0,0,0,.08); }
.diagnosis .cta { margin-top:10px; font-size:14px; font-weight:700; color:#1a1a1a; padding:8px 10px; background:rgba(255,255,255,.65); border-radius:8px; }

.share-btn { display:none; width:100%; height:44px; margin-top:14px; background:#fff; color:var(--purple); border:2px solid var(--purple); border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; letter-spacing:1px; transition:all .2s; }
.share-btn:hover { background:var(--purple-bg); }
.share-btn.show { display:block; }

/* tier colors */
.tier-extra .score-ring { border:4px solid var(--purple); background:var(--purple-bg); }
.tier-extra .pct { color:var(--purple); }
.tier-extra .unit-label { color:var(--purple); }
.tier-extra .diagnosis { background:var(--purple-bg); border:1px solid rgba(83,74,183,.15); }
.tier-extra .diagnosis .level { color:var(--purple); }

.tier-smooth .score-ring { border:4px solid var(--green); background:var(--green-bg); box-shadow:inset 0 0 0 3px rgba(83,74,183,.22); }
.tier-smooth .pct { color:var(--green); }
.tier-smooth .unit-label { color:var(--green); }
.tier-smooth .diagnosis { background:var(--green-bg); border:1px solid rgba(59,109,17,.15); }
.tier-smooth .diagnosis .level { color:var(--green); }

.tier-sticky .score-ring { border:4px solid #F57C00; background:#FFF8E1; }
.tier-sticky .pct { color:#F57C00; }
.tier-sticky .unit-label { color:#F57C00; }
.tier-sticky .diagnosis { background:#FFF8E1; border:1px solid rgba(245,124,0,.2); }
.tier-sticky .diagnosis .level { color:#F57C00; }

.tier-mud .score-ring { border:4px solid var(--red); background:var(--red-bg); }
.tier-mud .pct { color:var(--red); }
.tier-mud .unit-label { color:var(--red); }
.tier-mud .diagnosis { background:var(--red-bg); border:1px solid rgba(153,60,29,.2); }
.tier-mud .diagnosis .level { color:var(--red); }

.tier-broken .score-ring { border:4px solid #fff; background:#4A1B0C; }
.tier-broken .pct { color:#fff; }
.tier-broken .unit-label { color:rgba(255,255,255,.7); }
.tier-broken .diagnosis { background:#4A1B0C; }
.tier-broken .diagnosis .level { color:#fff; }
.tier-broken .diagnosis .desc { color:rgba(255,255,255,.85); }
.tier-broken .diagnosis .tip { color:rgba(255,255,255,.6); border-top-color:rgba(255,255,255,.15); }
.tier-broken .diagnosis .cta { color:#fff; background:rgba(255,255,255,.08); }

.footer { margin-top:22px; text-align:center; font-size:12px; color:var(--sub); padding-top:18px; border-top:1px solid var(--border); }
</style>
</head>
<body>
<div class="card">

  <div class="header">
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>
    <h1>H<sub>2</sub>O <span data-t="title">逻辑浓度计算器</span></h1>
    <div class="sub"><span data-t="brand">茂林逻辑协议</span> · <span data-t="formula">浓度 = 理论最短时间 ÷ 实际耗时 × 100%</span></div>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>① <span data-t="q1">这件事【最短需要】多少时间？</span><span class="hint" data-t="h1">一切顺利，不卡壳。如果你比这个还快，可能低估了它</span></label>
    <div class="input-row">
      <input type="number" id="minTime" placeholder="5" min="1" step="0.1" inputmode="decimal">
      <span class="suffix" data-t="min">分钟</span>
    </div>
  </div>

  <div class="field">
    <label>② <span data-t="q2">【实际上】花了多少时间？</span><span class="hint" data-t="h2">凭实际感受填</span></label>
    <div class="input-row">
      <input type="number" id="actualTime" placeholder="20" min="1" step="0.1" inputmode="decimal">
      <span class="suffix" data-t="min">分钟</span>
    </div>
  </div>

  <button class="btn" onclick="calculate()" data-t="ctaBtn">测 一 下</button>

  <div class="result" id="result"></div>
  <button class="share-btn" id="shareBtn" onclick="shareImage()" data-t="share">📸 生成分享图</button>

  <div class="footer" data-t="footer">逻辑浓度，是你实际产出的时间除以你投入的所有时间。</div>

</div>

<!-- Hidden canvas for image generation -->
<canvas id="shareCanvas" width="1080" height="1080" style="display:none;"></canvas>

<script>
// ============ Translations ============
const T = {
  zh: {
    title: '逻辑浓度计算器',
    brand: '茂林逻辑协议',
    formula: '浓度 = 理论最短时间 ÷ 实际耗时 × 100%',
    q1: '这件事【最短需要】多少时间？',
    h1: '一切顺利，不卡壳。如果你比这个还快，可能低估了它',
    q2: '【实际上】花了多少时间？',
    h2: '凭实际感受填',
    min: '分钟',
    ctaBtn: '测 一 下',
    share: '📸 生成分享图',
    footer: '逻辑浓度，是你实际产出的时间除以你投入的所有时间。',
    errTitle: '📋 等一下',
    errBody: '两个空都填上大于 0 的数字。',
    unitLabel: '逻辑浓度',
    metaPrefix: '实际耗时是理论时间的 ',
    metaSuffix: ' 倍',
    tiers: {
      extra: { level: '突破理论极值', desc: (m,a,p) => `你用了 ${a} 分钟，比理论最短还快了 ${Math.round((m-a)/m*100)}%。两种可能：你对流程太熟了，或者你的理论值算得有点保守。`, tip: '如果核完数据还是这个数——你这个流程可以写进案例。但建议先回去看看"最短需要"那一栏擦不扎实。', cta: (p) => `浓度 ${p}%，先核数据再确认。` },
      anomaly: { level: '⚠ 数据似乎有误', desc: (m,a) => `你填的理论值是 ${m} 分钟，但实际只花了 ${a} 分钟。理论只有实际的三分之一不到——先回看「最短需要」那一栏，是不是记错了？`, tip: '如果两个数字都没问题，那你这个流程已经是教科书级别。但通常这种情况，是低估了理论值。', cta: (p) => `浓度 ${p}%，先核数据再谈优化。` },
      smooth: { level: '丝滑级 · 逻辑浓度健康', desc: (m,a) => `${a} 分钟搞定 ${m} 分钟的活，流程挺顺。`, tip: '可以拿这个数跟同行的水平对一下—— 如果浓度能对标 90% 的顶尖玩家，你可能只需要优化一到两个动作。', cta: '' },
      sticky: { level: '黏糊级 · 逻辑在空转', desc: (m,a) => `投入 ${a} 分钟，只有 ${m} 分钟在真正产出。另外 ${a-m} 分钟消耗在流程中的某个环节上——可能是等批、可能是反复确认、可能是来回折腾。你心里应该已经有答案了。`, tip: (m,a) => `找一下你流程中 "最想叹气的第一步" —— 那就是卡点。卡点不除，你每天多花 ${a-m} 分钟。`, cta: (p) => `浓度 ${p}%，流程在空转。需要定位卡点。` },
      mud: { level: '泥沼级 · 流程有结构性问题', desc: (x) => `实际耗时是最短时间的 ${x} 倍。不是一两个卡点——是好几个卡点叠在一起，互相绊。`, tip: '用 H₂O 协议的 "流向 → 卡点 → 和谐" 全流程扫一遍。先问自己：多出来的时间主要是找东西、沟通扯皮，还是重复返工？先拆最大的一类。', cta: (p) => `浓度 ${p}%，一天里只有 ${Math.round(p/100*60)} 分钟在真正干活。需要 H₂O 审计。` },
      broken: { level: '失序级 · 流程需要重建', desc: (m,a,p,x) => `你花了 ${a} 分钟，但理论只需要 ${m} 分钟。${100-p}% 的时间被卡点吃掉了。`, tip: '不是你的问题。是流程设计本身就不对。不要再修修补补了—— 按 "流向 → 卡点 → 和谐" 的顺序，从零捋一遍。', cta: (p) => `浓度 ${p}%，急需逻辑审计。` }
    },
    shareImg: {
      title: 'H₂O 逻辑浓度',
      subtitle: '茂林逻辑协议',
      footer: 'maolinwang-h2o.github.io/H2O-Logic-Counter',
      slogan: '实际产出 ÷ 投入的所有时间'
    }
  },
  en: {
    title: 'Logic Concentration',
    brand: 'Maolin Protocol',
    formula: 'Conc. = Theoretical Minimum ÷ Actual Time × 100%',
    q1: '① Minimum time needed?',
    h1: 'If everything runs smoothly. If you beat this, you might have underestimated.',
    q2: '② Actual time spent?',
    h2: 'Your best honest guess',
    min: 'min',
    ctaBtn: 'Measure',
    share: '📸 Share Card',
    footer: 'Logic Concentration is your actual output divided by the total time you invested.',
    errTitle: '📋 Hold on',
    errBody: 'Both fields need a number greater than 0.',
    unitLabel: 'Concentration',
    metaPrefix: 'Actual took ',
    metaSuffix: '× the theoretical minimum',
    tiers: {
      extra: { level: 'Beyond Theoretical Limit', desc: (m,a,p) => `Took ${a} min vs. ${m} min theoretical. ${Math.round((m-a)/m*100)}% faster than the benchmark. Either you\'re extremely skilled, or your theoretical estimate was conservative.`, tip: 'If both numbers are correct — this workflow deserves a case study.', cta: (p) => `${p}% — verify data before confirming.` },
      anomaly: { level: '⚠ Check Your Data', desc: (m,a) => `Theoretical: ${m} min. Actual: ${a} min. The gap is too extreme — re-examine the first field.`, tip: 'If both numbers are truly correct, you have a textbook-level workflow. But most likely, the theoretical number was underestimated.', cta: (p) => `${p}% — verify before optimizing.` },
      smooth: { level: 'Silky · Healthy', desc: (m,a) => `${a} min to deliver ${m} min of value. Smooth.`, tip: 'Compare with industry benchmarks. If you can hit 90% concentration, you may only need small tweaks.', cta: '' },
      sticky: { level: 'Sticky · Wasted Motion', desc: (m,a) => `Spent ${a} min, only ${m} min of real output. The other ${a-m} min went somewhere — maybe waiting, re-confirming, or redoing. You probably already know where.`, tip: (m,a) => `Find "the first step that made you sigh" — that\'s your bottleneck. Until you fix it, every cycle costs an extra ${a-m} min.`, cta: (p) => `${p}% — locate the bottleneck.` },
      mud: { level: 'Muddy · Structural Issues', desc: (x) => `Actual is ${x}× the theoretical minimum. Multiple bottlenecks are tangled together.`, tip: 'Use H₂O: Flow → Bottleneck → Harmony. Ask yourself: is the wasted time from searching, coordination, or rework?', cta: (p) => `${p}% — only ${Math.round(p/100*60)} productive min/hr. Needs audit.` },
      broken: { level: 'Broken · Rebuild Needed', desc: (m,a,p,x) => `Spent ${a} min for a ${m}-min job. ${100-p}% consumed by bottlenecks.`, tip: 'Not your fault. The process design is broken. Stop patching. Rebuild from zero: Flow → Bottleneck → Harmony.', cta: (p) => `${p}% — urgent audit needed.` }
    },
    shareImg: {
      title: 'H₂O Logic Concentration',
      subtitle: 'Maolin Logic Protocol',
      footer: 'maolinwang-h2o.github.io/H2O-Logic-Counter',
      slogan: 'actual output ÷ total time invested'
    }
  }
};

// ============ Language State ============
let lang = localStorage.getItem('h2o-lang') || 'zh';
let lastResult = null; // store result data for share

function t(key) { return T[lang][key]; }

function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('h2o-lang', lang);
  applyLang();
  if (lastResult) renderResult();
}

function applyLang() {
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    const val = t(key);
    if (typeof val === 'string') el.textContent = val;
  });
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  document.querySelector('title').textContent = 'H₂O ' + t('title');
}

// ============ Calculation ============
function calculate() {
  const min = parseFloat(document.getElementById('minTime').value);
  const actual = parseFloat(document.getElementById('actualTime').value);
  const el = document.getElementById('result');
  const shareEl = document.getElementById('shareBtn');

  if (!min || !actual || min <= 0 || actual <= 0) {
    el.className = 'result show';
    el.innerHTML = `<div class="diagnosis" style="background:#fff3cd;border:1px solid #ffc107;"><div class="level" style="color:#856404;">${t('errTitle')}</div><div class="desc">${t('errBody')}</div></div>`;
    shareEl.classList.remove('show');
    lastResult = null;
    return;
  }

  const yieldPct = Math.round((min / actual) * 100);
  const lossX = Math.round((actual / min) * 10) / 10;
  let tier, level, desc, tip, cta;
  const tiers = t('tiers');

  if (yieldPct >= 100) {
    tier = 'tier-extra';
    if (actual < min * 0.3) {
      const tr = tiers.anomaly;
      level = tr.level; desc = tr.desc(min, actual); tip = tr.tip; cta = tr.cta(yieldPct);
    } else {
      const tr = tiers.extra;
      level = tr.level; desc = tr.desc(min, actual, yieldPct); tip = tr.tip; cta = tr.cta(yieldPct);
    }
  } else if (yieldPct >= 70) {
    tier = 'tier-smooth';
    const tr = tiers.smooth;
    level = tr.level; desc = tr.desc(min, actual); tip = tr.tip; cta = tr.cta || '';
  } else if (yieldPct >= 30) {
    tier = 'tier-sticky';
    const tr = tiers.sticky;
    level = tr.level; desc = tr.desc(min, actual); tip = tr.tip(min, actual); cta = tr.cta(yieldPct);
  } else if (yieldPct >= 10) {
    tier = 'tier-mud';
    const tr = tiers.mud;
    level = tr.level; desc = tr.desc(lossX); tip = tr.tip; cta = tr.cta(yieldPct);
  } else {
    tier = 'tier-broken';
    const tr = tiers.broken;
    level = tr.level; desc = tr.desc(min, actual, yieldPct, lossX); tip = tr.tip; cta = tr.cta(yieldPct);
  }

  lastResult = { yieldPct, lossX, tier, level, desc, tip, cta, min, actual };

  renderResult();
}

function renderResult() {
  if (!lastResult) return;
  const { yieldPct, lossX, tier, level, desc, tip, cta, min, actual } = lastResult;
  const el = document.getElementById('result');
  const shareEl = document.getElementById('shareBtn');
  const lossStyle = lossX >= 3 ? ' style="color:#993C1D;font-weight:800;"' : '';

  el.className = `result show ${tier}`;
  el.innerHTML = `
    <div class="score-ring">
      <div class="pct">${yieldPct}%</div>
      <div class="unit-label">${t('unitLabel')}</div>
    </div>
    <div class="meta-bar">${t('metaPrefix')}<strong${lossStyle}>${lossX}${t('metaSuffix')}</strong></div>
    <div class="diagnosis">
      <div class="level">${level}</div>
      <div class="desc">${desc}</div>
      <div class="tip">${tip}</div>
      ${cta ? `<div class="cta">⚠ ${cta}</div>` : ''}
    </div>
  `;
  shareEl.classList.add('show');
  shareEl.textContent = t('share');
}

// ============ Share Image ============
function shareImage() {
  if (!lastResult) return;
  const { yieldPct, tier, level } = lastResult;
  const si = t('shareImg');
  const c = document.getElementById('shareCanvas');
  const ctx = c.getContext('2d');
  const W = 1080, H = 1080;

  // Determine tier color
  const tierColors = {
    'tier-extra': '#534AB7',
    'tier-smooth': '#3B6D11',
    'tier-sticky': '#F57C00',
    'tier-mud': '#993C1D',
    'tier-broken': '#4A1B0C'
  };
  const tierBgColors = {
    'tier-extra': '#f9f8ff',
    'tier-smooth': '#F3F8EC',
    'tier-sticky': '#FFF8E1',
    'tier-mud': '#FBF1ED',
    'tier-broken': '#4A1B0C'
  };
  const color = tierColors[tier] || '#534AB7';
  const bgColor = tierBgColors[tier] || '#f9f8ff';
  const isDark = tier === 'tier-broken';
  const textColor = isDark ? '#fff' : '#2c2c2c';
  const subColor = isDark ? 'rgba(255,255,255,.7)' : '#5F5E5A';

  // Background
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  // Top area - score ring
  const cx = W / 2, cy = 380;
  // Ring
  ctx.beginPath();
  ctx.arc(cx, cy, 180, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 10;
  ctx.fillStyle = bgColor;
  ctx.fill();
  ctx.stroke();
  // Score
  ctx.fillStyle = color;
  ctx.font = 'bold 120px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(yieldPct + '%', cx, cy + 30);
  // Label
  ctx.fillStyle = subColor;
  ctx.font = '28px -apple-system, sans-serif';
  ctx.fillText(t('unitLabel'), cx, cy + 80);

  // Tier level
  ctx.fillStyle = textColor;
  ctx.font = 'bold 42px -apple-system, sans-serif';
  ctx.fillText(level, cx, 670);

  // Subtitle
  ctx.fillStyle = subColor;
  ctx.font = '26px -apple-system, sans-serif';
  ctx.fillText(si.subtitle, cx, 740);

  // Divider
  ctx.strokeStyle = isDark ? 'rgba(255,255,255,.2)' : '#e8e5ff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(240, 800);
  ctx.lineTo(W - 240, 800);
  ctx.stroke();

  // Slogan
  ctx.fillStyle = subColor;
  ctx.font = '24px -apple-system, sans-serif';
  ctx.fillText(si.slogan, cx, 870);

  // Footer URL
  ctx.fillStyle = isDark ? 'rgba(255,255,255,.5)' : '#b0b0b0';
  ctx.font = '20px -apple-system, sans-serif';
  ctx.fillText(si.footer, cx, 970);

  // H₂O brand mark top-left
  ctx.fillStyle = color;
  ctx.font = 'bold 32px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('H₂O', 60, 80);
  ctx.textAlign = 'center';

  // Trigger download
  const link = document.createElement('a');
  link.download = 'h2o-logic-concentration.png';
  link.href = c.toDataURL('image/png');
  link.click();
}

// ============ Init ============
applyLang();
</script>
</body>
</html>

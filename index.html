<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>H₂O Clarity Thermometer</title>
<style>
:root {
  /* 3体温区 — 颜色深度拉开 */
  --cool: #16A34A; --cool-bg: #F0FDF4; --cool-glow: rgba(22,163,74,.15);
  --warm: #D97706; --warm-bg: #FFFBEB; --warm-glow: rgba(217,119,6,.15);
  --hot: #DC2626; --hot-bg: #FEF2F2; --hot-glow: rgba(220,38,38,.12);
  --purple: #534AB7; --purple-bg: #f9f8ff;
  --orange-btn: #ED6C30;
  --text: #2c2c2c; --sub: #5F5E5A; --border: #e8e5ff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f5f5; display:flex; justify-content:center; align-items:center;
  min-height:100vh; padding:16px;
}
.card { max-width:420px; width:100%; background:#fff; border-radius:20px; padding:28px 22px 24px; box-shadow:0 4px 24px rgba(0,0,0,.06); }
.header { text-align:center; margin-bottom:24px; position:relative; }
.lang-btn {
  position:absolute; right:0; top:0; font-size:12px; font-weight:600;
  background:var(--purple-bg); color:var(--purple); border:1px solid var(--border);
  border-radius:8px; padding:4px 10px; cursor:pointer; transition:opacity .2s;
}
.lang-btn:hover { opacity:.8; }
.header h1 { font-size:22px; color:var(--text); font-weight:700; margin-bottom:8px; }
.header h1 sub { font-size:14px; font-weight:600; vertical-align:-2px; }
.header .sub { font-size:12px; color:var(--sub); letter-spacing:1px; margin-top:6px; }
.header .sub span { color:var(--purple); font-weight:600; }
.divider { height:1px; background:var(--border); margin:0 -22px 22px; }
.field { margin-bottom:18px; }
.field label { display:block; font-size:14px; color:var(--text); margin-bottom:10px; font-weight:500; }
.field .hint { font-size:12px; color:var(--sub); font-weight:400; margin-left:5px; }
.honesty-hint { text-align:center; font-size:12px; color:var(--sub); font-weight:400; margin:2px 0 6px; line-height:1.5; }
.input-row { display:flex; align-items:center; gap:8px; }
.input-row input { flex:1; height:46px; border:2px solid #e0e0e0; border-radius:12px; padding:0 14px; font-size:17px; font-weight:600; color:var(--text); outline:none; transition:border .2s; text-align:center; -webkit-appearance:none; }
.input-row input::placeholder { color:#b5b5b5; font-weight:400; font-size:15px; }
.input-row input:focus { border-color:var(--purple); }
.input-row .suffix { font-size:14px; color:var(--sub); white-space:nowrap; }
.btn { width:100%; height:50px; background:var(--orange-btn); color:#fff; border:none; border-radius:14px; font-size:17px; font-weight:700; cursor:pointer; margin-top:6px; letter-spacing:2px; transition:transform .15s,box-shadow .15s; box-shadow:0 4px 14px rgba(237,108,48,.35); }
.btn:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(237,108,48,.45); }
.btn:active { transform:translateY(0); box-shadow:0 2px 8px rgba(237,108,48,.3); }

.result { margin-top:22px; display:none; }
.result.show { display:block; }

/* 圆环仪表 */
.score-ring { width:140px; height:140px; margin:0 auto 12px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; transition:all .4s ease; }
.score-ring .pct { font-size:48px; font-weight:800; line-height:1; transition:color .4s; }
.score-ring .unit-label { font-size:12px; margin-top:2px; transition:color .4s; }

/* ====== 体温预警条（新增）====== */
.temp-bar-wrap { margin:0 auto 14px; max-width:280px; }
.temp-bar-label { display:flex; justify-content:space-between; font-size:11px; color:var(--sub); margin-bottom:4px; padding:0 2px; }
.temp-bar-track { height:10px; border-radius:5px; background:linear-gradient(to right, var(--hot) 0%, var(--hot) 50%, var(--warm) 50%, var(--warm) 80%, var(--cool) 80%, var(--cool) 100%); position:relative; overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.12); }
.temp-bar-marker { position:absolute; top:-3px; width:16px; height:16px; border-radius:50%; background:#fff; border:3px solid; transform:translateX(-50%); left:0%; transition:left .5s cubic-bezier(.34,1.56,.64,1); box-shadow:0 2px 6px rgba(0,0,0,.2); z-index:2; }
.temp-bar-ticks { display:flex; justify-content:space-between; margin-top:4px; padding:0 2px; }
.temp-bar-ticks span { font-size:10px; color:#aaa; }

/* 3体温区 — 圆环 + 诊断卡颜色 */
.zone-cool .score-ring { border:5px solid var(--cool); background:var(--cool-bg); box-shadow:0 0 20px var(--cool-glow), inset 0 0 20px var(--cool-glow); }
.zone-cool .pct { color:var(--cool); }
.zone-cool .unit-label { color:var(--cool); opacity:.7; }
.zone-cool .diagnosis { background:var(--cool-bg); border:1px solid rgba(22,163,74,.2); }
.zone-cool .diagnosis .level { color:var(--cool); }
.zone-cool .temp-bar-marker { border-color: var(--cool); }

.zone-warm .score-ring { border:5px solid var(--warm); background:var(--warm-bg); box-shadow:0 0 18px var(--warm-glow); }
.zone-warm .pct { color:var(--warm); }
.zone-warm .unit-label { color:var(--warm); opacity:.7; }
.zone-warm .diagnosis { background:var(--warm-bg); border:1px solid rgba(217,119,6,.2); }
.zone-warm .diagnosis .level { color:var(--warm); }
.zone-warm .temp-bar-marker { border-color: var(--warm); }

.zone-hot .score-ring { border:5px solid var(--hot); background:var(--hot-bg); box-shadow:0 0 18px var(--hot-glow); }
.zone-hot .pct { color:var(--hot); }
.zone-hot .unit-label { color:var(--hot); opacity:.7; }
.zone-hot .diagnosis { background:var(--hot-bg); border:1px solid rgba(220,38,38,.25); }
.zone-hot .diagnosis .level { color:var(--hot); }
.zone-hot .diagnosis .desc { color:rgba(220,38,38,.85); }
.zone-hot .temp-bar-marker { border-color: var(--hot); }

.meta-bar { text-align:center; font-size:13px; color:var(--sub); margin-bottom:14px; }
.meta-bar strong { color:var(--text); }

.diagnosis { border-radius:14px; padding:18px; font-size:14px; line-height:1.8; text-align:left; }
.diagnosis .level { font-size:17px; font-weight:800; margin-bottom:6px; letter-spacing:.5px; }
.diagnosis .desc { font-size:14px; margin-bottom:10px; line-height:1.7; }
.diagnosis .tip { font-size:13px; color:var(--sub); margin-top:8px; padding-top:10px; border-top:1px solid rgba(0,0,0,.08); }
.diagnosis .cta { margin-top:10px; font-size:14px; font-weight:700; padding:8px 10px; background:rgba(255,255,255,.65); border-radius:8px; }
.golden-quote { margin-top:14px; padding:14px 16px; font-size:15px; font-weight:700; line-height:1.7; text-align:center; color:#fff; border-radius:12px; background:linear-gradient(135deg,#1f2937,#374151); box-shadow:0 6px 18px rgba(0,0,0,.18); letter-spacing:.5px; }
.zone-cool .golden-quote { background:linear-gradient(135deg,#0f5132,#16A34A); box-shadow:0 6px 18px rgba(22,163,74,.28); }
.zone-warm .golden-quote { background:linear-gradient(135deg,#92400e,#D97706); box-shadow:0 6px 18px rgba(217,119,6,.28); }
.zone-hot .golden-quote { background:linear-gradient(135deg,#991b1b,#DC2626); box-shadow:0 6px 18px rgba(220,38,38,.3); }
.formula-ref { margin-top:10px; font-size:11px; color:#aaa; text-align:center; font-style:italic; }
.calibrate-hint { margin-top:8px; font-size:12px; color:#999; line-height:1.6; }

.share-btn { display:none; width:100%; height:44px; margin-top:14px; background:rgba(83,74,183,0.04); color:var(--purple); border:2px solid var(--purple); border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; letter-spacing:1px; transition:all .2s; }
.share-btn:hover { background:rgba(83,74,183,0.10); border-color:#3D3499; }
.share-btn.show { display:block; }

.footer { margin-top:22px; text-align:center; font-size:11px; color:var(--sub); padding-top:18px; border-top:1px solid var(--border); }

/* 呼吸动画 — 让圆环"活着" */
@keyframes breathe { 0%,100%{transform:scale(1);} 50%{transform:scale(1.02);} }
.zone-cool .score-ring { animation:breathe 3s ease-in-out infinite; }
.zone-warm .score-ring { animation:breathe 2.5s ease-in-out infinite; }
.zone-hot .score-ring { animation:breathe 2s ease-in-out infinite; }

</style>
</head>
<body>
<div class="card">

  <div class="header">
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">EN</button>

  </div>

  <div class="field">
    <label>① <span data-t="q1">这件事【最短需要】多少时间？</span><span class="hint" data-t="h1">一切顺利，不卡壳</span></label>
    <div class="input-row">
      <input type="number" id="minTime" placeholder="例：本来 10 分钟就能讲明白" min="1" step="0.1" inputmode="decimal">
      <span class="suffix" data-t="min">分钟</span>
    </div>
  </div>

  <div class="field">
    <label>② <span data-t="q2">【实际上】花了多少时间？</span><span class="hint" data-t="h2">凭实际感受填</span></label>
    <div class="input-row">
      <input type="number" id="actualTime" placeholder="例：实际开会开了 120 分钟" min="1" step="0.1" inputmode="decimal">
      <span class="suffix" data-t="min">分钟</span>
    </div>
  </div>

  <div class="honesty-hint" data-t="honesty">💡 假数据测出的水分，也是假的</div>

  <button class="btn" onclick="calculate()" data-t="ctaBtn">测 一 下</button>

  <div class="result" id="result"></div>
  <button class="share-btn" id="shareBtn" onclick="shareImage()" data-t="share">📸 生成分享图</button>

  <div class="footer" data-t="footer">数值越高，卡点越少。</div>


</div>

<!-- Hidden canvas for image generation -->
<canvas id="shareCanvas" width="1080" height="1080" style="display:none;"></canvas>

// ============ Language State ============
let lang = localStorage.getItem('h2o-lang') || 'zh';
let lastResult = null;

function t(key) { return T[lang][key]; }

function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('h2o-lang', lang);
  applyLang();
  if (lastResult) renderResult();
}

function applyLang() {
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    const val = t(key);
    if (typeof val === 'string') el.textContent = val;
  });
  document.getElementById('langBtn').textContent = lang === 'zh' ? 'EN' : '中';
  document.querySelector('title').textContent = 'H₂O ' + t('title');
  // placeholder 国际化
  const ph1 = t('ph1'), ph2 = t('ph2');
  if (ph1) document.getElementById('minTime').placeholder = ph1;
  if (ph2) document.getElementById('actualTime').placeholder = ph2;
}

// ============ 7档→3体温区 映射 ============
function getZone(pct) {
  if (pct >= 80) return 'cool';     // match/extra/anomaly/smooth → 清醒
  if (pct >= 50) return 'warm';     // steady/sticky → 温热
  return 'hot';                      // mud/broken → 过热
}

function clampPct(pct) {
  // 体温条映射: 0-100% → 条上位置 0%-100%
  return Math.max(0, Math.min(100, pct));
}

// 同 zone 内按分数高低分 5 档（0=最弱/最轻 → 4=最强/最重），保证等级与分数挂钩不倒挂
function zoneIndex(zone, pct) {
  if (zone === 'cool') return Math.max(0, Math.min(4, Math.floor((pct - 80) / 5)));   // 80-84→0 … 100+→4
  if (zone === 'warm') return Math.max(0, Math.min(4, Math.floor((pct - 50) / 6)));   // 50-55→0 … 74-79→4
  return Math.max(0, Math.min(4, Math.floor(pct / 10)));                               // hot: 0-9→0 … 40-49→4
}

// ============ Calculation ============
function calculate() {
  const min = parseFloat(document.getElementById('minTime').value);
  const actual = parseFloat(document.getElementById('actualTime').value);
  const el = document.getElementById('result');
  const shareEl = document.getElementById('shareBtn');

  if (!min || !actual || min <= 0 || actual <= 0) {
    el.className = 'result show';
    el.innerHTML = `<div class="diagnosis" style="background:#fff3cd;border:1px solid #ffc107;"><div class="level" style="color:#856404;">${t('errTitle')}</div><div class="desc">${t('errBody')}</div></div>`;
    shareEl.classList.remove('show');
    lastResult = null;
    return;
  }

  const yieldPct = Math.round((min / actual) * 100);
  const lossX = Math.round((actual / min) * 10) / 10;
  const zone = getZone(yieldPct);
  const zData = t('zones')[zone];

  lastResult = { yieldPct, lossX, zone, zData, min, actual };

  renderResult();
}

function renderResult() {
  if (!lastResult) return;
  const { yieldPct, lossX, zone, zData, min, actual } = lastResult;
  const el = document.getElementById('result');
  const shareEl = document.getElementById('shareBtn');
  const lossStyle = lossX >= 3 ? ' style="color:#DC2626;font-weight:800;"' : '';

  // 从多元文案池随机抽取（level按分数档位固定，其余随机保持灵活好玩）
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const idx = zoneIndex(zone, yieldPct);
  const level = zData.levels[idx];
  const descFn = pick(zData.descs);
  const tipFn = pick(zData.tips);
  const ctaFn = pick(zData.ctas);
  const quote = pick(zData.quotes);

  // 体温条位置: pct → %
  const barPos = clampPct(yieldPct);

  el.className = `result show zone-${zone}`;
  el.innerHTML = `
    <div class="score-ring">
      <div class="pct">${yieldPct}%</div>
      <div class="unit-label">${t('unitLabel')}</div>
    </div>

    <!-- 体温预警条 -->
    <div class="temp-bar-wrap">
      <div class="temp-bar-label">
        <span>${t('tempBarLabel')[0]}</span>
        <span>${t('tempBarLabel')[1]}</span>
        <span>${t('tempBarLabel')[2]}</span>
      </div>
      <div class="temp-bar-track">
        <div class="temp-bar-marker" style="left:${barPos}%;"></div>
      </div>
      <div class="temp-bar-ticks">
        <span>&lt;50%</span>
        <span>50-80%</span>
        <span>80%+</span>
      </div>
    </div>

    <div class="meta-bar">${t('metaPrefix')}<strong${lossStyle}>${lossX}${t('metaSuffix')}</strong></div>
    <div class="diagnosis">
      <div class="level">${level}</div>
      <div class="desc">${descFn(min, actual, yieldPct, lossX)}</div>
      <div class="tip">${typeof tipFn === 'function' ? tipFn(min, actual) : tipFn}</div>
      ${yieldPct > 100 ? `<div class="calibrate-hint">${t('calibrateHint')}</div>` : ''}
      <div class="cta">${ctaFn(yieldPct)}</div>
      <div class="golden-quote">💡 ${quote}</div>
      <div class="formula-ref">${t('formula')}</div>
    </div>
  `;
  lastResult.goldenQuote = quote;
  shareEl.classList.add('show');
  shareEl.textContent = t('share');
}

// ============ Share Image ============
function shareImage() {
  if (!lastResult) return;
  const { yieldPct, zone } = lastResult;
  const si = t('shareImg');
  const c = document.getElementById('shareCanvas');
  const ctx = c.getContext('2d');
  const W = 1080, H = 1080;

  // Zone colors for share card
  const zoneColors = {
    cool: { ring: '#16A34A', bg: '#F0FDF4', text: '#2c2c2c' },
    warm: { ring: '#D97706', bg: '#FFFBEB', text: '#2c2c2c' },
    hot:  { ring: '#DC2626', bg: '#FEF2F2', text: '#2c2c2c' }
  };
  const zColor = zoneColors[zone] || zoneColors.cool;
  const isHot = zone === 'hot';

  // Background
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  // Score ring
  const cx = W / 2, cy = 360;
  ctx.beginPath();
  ctx.arc(cx, cy, 180, 0, Math.PI * 2);
  ctx.strokeStyle = zColor.ring;
  ctx.lineWidth = 12;
  ctx.fillStyle = zColor.bg;
  ctx.fill();
  ctx.stroke();

  // Score number
  ctx.fillStyle = zColor.ring;
  ctx.font = 'bold 120px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(yieldPct + '%', cx, cy + 35);

  // Unit label
  ctx.fillStyle = isHot ? 'rgba(220,38,38,.6)' : 'rgba(22,163,74,.6)';
  ctx.font = '28px -apple-system, sans-serif';
  ctx.fillText(t('unitLabel'), cx, cy + 80);

  // Temperature bar on share card
  const barY = 520;
  const barW = 600, barH = 16, barLeft = (W - barW) / 2;
  // Track gradient
  const grad = ctx.createLinearGradient(barLeft, 0, barLeft + barW, 0);
  grad.addColorStop(0, '#DC2626');
  grad.addColorStop(0.5, '#D97706');
  grad.addColorStop(0.8, '#D97706');
  grad.addColorStop(0.8, '#16A34A');
  grad.addColorStop(1, '#16A34A');
  ctx.fillStyle = grad;
  roundRect(ctx, barLeft, barY, barW, barH, 8);
  ctx.fill();

  // Marker dot
  const markerX = barLeft + (clampPct(yieldPct) / 100) * barW;
  ctx.beginPath();
  ctx.arc(markerX, barY + barH/2, 14, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = zColor.ring;
  ctx.lineWidth = 4;
  ctx.stroke();

  // Bar labels
  ctx.fillStyle = '#999';
  ctx.font = '22px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('<50%', barLeft, barY + 48);
  ctx.textAlign = 'center';
  ctx.fillText('50-80%', cx, barY + 48);
  ctx.textAlign = 'right';
  ctx.fillText('80%+', barLeft + barW, barY + 48);

  // Zone level
  ctx.fillStyle = zColor.ring;
  ctx.font = 'bold 44px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  // Zone level text (pick from pool for share too)
  const zoneData = t('zones')[zone];
  const levelText = zoneData.levels[Math.floor(Math.random() * zoneData.levels.length)];
  ctx.fillText(levelText, cx, 640);

  // Subtitle
  ctx.fillStyle = '#5F5E5A';
  ctx.font = '26px -apple-system, sans-serif';
  ctx.fillText(si.subtitle, cx, 700);

  // Golden quote block on share card
  const qText = lastResult.goldenQuote || '';
  ctx.font = 'bold 30px -apple-system, sans-serif';
  const maxW = 800;
  let qlines = [], qcur = '';
  for (const ch of qText) {
    const test = qcur + ch;
    if (ctx.measureText(test).width > maxW && qcur) { qlines.push(qcur); qcur = ch; }
    else qcur = test;
  }
  if (qcur) qlines.push(qcur);
  qlines = qlines.slice(0, 2);
  const qBoxH = qlines.length * 42 + 40;
  const qBoxY = 730;
  ctx.fillStyle = zColor.ring;
  roundRect(ctx, 120, qBoxY, W - 240, qBoxH, 18);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 30px -apple-system, sans-serif';
  qlines.forEach((ln, i) => ctx.fillText(ln, cx, qBoxY + 46 + i * 42));
  ctx.font = '22px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.fillText('💡 金句', cx, qBoxY + qBoxH - 14);

  // Slogan
  ctx.fillStyle = '#5F5E5A';
  ctx.font = '24px -apple-system, sans-serif';
  ctx.fillText(si.slogan, cx, 900);

  // Footer URL
  ctx.fillStyle = '#b0b0b0';
  ctx.font = '20px -apple-system, sans-serif';
  ctx.fillText(si.footer, cx, 960);

  // Brand mark top-left
  ctx.fillStyle = zColor.ring;
  ctx.font = 'bold 32px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('H₂O', 60, 80);
  ctx.textAlign = 'center';

  // Download
  const link = document.createElement('a');
  link.download = 'h2o-clarity-thermometer.png';
  link.href = c.toDataURL('image/png');
  link.click();
}

// Helper: rounded rect for canvas
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

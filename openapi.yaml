openapi: 3.0.3
info:
  title: H2O 清醒度体温计 API（H2O Clarity Thermometer Protocol）
  description: >
    一个极简、零依赖、零状态的计算内核：输入「预估耗时」与「实际耗时」，
    输出「失控系数 R」+ 4 级体温定级 + 刺痛文案。可作为量化「时间失控 /
    逻辑浓度（Logic Concentration）」的开放标准协议，被任何 Agent、MCP
    插件、GPTs 或后端直接调用。
  version: "1.0.0"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://h2o-clarity-thermometer.zeabur.app
    description: Live endpoint (Zeabur，部署后替换此占位地址)
  - url: http://localhost:8866
    description: Local dev
paths:
  /api/thermometer:
    post:
      summary: 计算清醒度体温
      operationId: computeThermometer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThermometerRequest'
            example:
              estimated_min: 30
              actual_min: 180
              scene_tag: short_video
      responses:
        '200':
          description: 成功（含 ok=false 的入参提示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThermometerResponse'
              examples:
                ok:
                  summary: 正常
                  value:
                    ok: true
                    R: 5.0
                    deviation_pct: 500
                    level: L3
                    level_name: 重度失控
                    clarity_pct: 17
                    card_text: 五倍。屏幕关掉后那点空虚，就是失控的实价。明天定个硬截止。
                    scene_tag: short_video
                no_estimate:
                  summary: 预估为 0（无意识失控期）
                  value:
                    ok: true
                    R: null
                    deviation_pct: null
                    level: L0
                    level_name: 无意识失控期
                    clarity_pct: null
                    card_text: 你连预估都没设，就已经失控了——这正是无意识让渡的典型。
                    scene_tag: general
                    warning: estimated_min 为 0 或空：失控系数无法计算，本次记为「无意识失控期」。
      tags:
        - thermometer
  /health:
    get:
      summary: 健康检查
      operationId: healthCheck
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
      tags:
        - system
components:
  schemas:
    ThermometerRequest:
      type: object
      required:
        - estimated_min
        - actual_min
      properties:
        estimated_min:
          type: integer
          description: 预估耗时（分钟）。0 或空不拒入，归 L0 无意识失控期。
          example: 30
        actual_min:
          type: integer
          description: 实际耗时（分钟）。须大于 0。
          example: 180
        scene_tag:
          type: string
          description: 场景标签，用于匹配刺痛文案。可选值 short_video / work_delay / impulse_buy / general。
          default: general
          example: short_video
    ThermometerResponse:
      type: object
      properties:
        ok:
          type: boolean
        R:
          type: number
          nullable: true
          description: 失控系数 R = (actual - estimated) / estimated
        deviation_pct:
          type: integer
          nullable: true
          description: 偏差百分比 = round(R × 100)
        level:
          type: string
          enum: [L0, L1, L2, L3]
        level_name:
          type: string
        clarity_pct:
          type: integer
          nullable: true
          description: 清醒度 = 100 × min(estimated, actual) / actual
        card_text:
          type: string
          description: 刺痛却本分的提醒文案
        scene_tag:
          type: string
        warning:
          type: string
          nullable: true

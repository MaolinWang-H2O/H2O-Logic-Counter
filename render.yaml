# Render 一键部署配置（GitHub 关联后自动构建）
# 文档：https://render.com/docs/deploy-python
services:
  - type: web
    name: h2o-clarity-thermometer
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python h2o-thermometer-api.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        generateValue: true
